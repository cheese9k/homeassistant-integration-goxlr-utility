[project]
name = "homeassistant-integration-goxlr-utility"
version = "0.1.0"
description = "GoXLR Utility integration for Home Assistant"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11", "jsonpatch==1.34"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
ha-test = ["pytest-homeassistant-custom-component>=0.13.210"]
dev = ["ruff>=0.11"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
